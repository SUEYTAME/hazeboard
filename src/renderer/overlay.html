<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>hazeboard overlay</title>
  <link rel="stylesheet" href="card.css" />
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <!-- Frozen capture of the desktop, blurred. Frozen rather than live on
       purpose: Windows acrylic gives no control over radius, saturation or
       contrast, and per-note contrast is the whole point. -->
  <img id="shot" alt="" />
  <div id="dim"></div>

  <div id="field"></div>

  <div id="newcard">
    <input type="text" placeholder="New panel..." autocomplete="off" spellcheck="false" />
  </div>

  <div id="hint"></div>

  <!-- First-run tutorial. Each step advances when the user actually does the
       thing it describes; overlay.ts owns the steps. -->
  <div id="coach" hidden>
    <div class="coach-step"></div>
    <div class="coach-title"></div>
    <div class="coach-body"></div>
    <div class="coach-actions">
      <button type="button" class="coach-skip">Skip tutorial</button>
      <button type="button" class="coach-done" hidden>Done</button>
    </div>
  </div>

  <!-- Drag on empty space: the rectangle marks where the new panel goes. -->
  <div id="drawrect" hidden><span>Release to put a panel here</span></div>
  <div id="draft" hidden>
    <input type="text" placeholder="First note for this panel..." autocomplete="off" spellcheck="false" />
  </div>

  <!-- Right-click a panel. -->
  <div id="panelmenu" hidden>
    <button type="button" class="pm-rename">Rename</button>
    <div class="pm-label">Colour</div>
    <div class="pm-swatches"></div>
    <div class="pm-label">Glass</div>
    <div class="pm-presets"></div>
    <input type="range" class="pm-glass" min="0" max="1" step="0.01" aria-label="Glass: see-through to solid" />
    <button type="button" class="pm-delete">Delete panel</button>
  </div>

  <div id="popover" hidden>
    <div class="swatches"></div>
    <label class="intensity">
      <span>contrast</span>
      <input type="range" min="0" max="1" step="0.02" />
    </label>
  </div>

  <!-- Same loader as board.html: scripts/copy-assets wraps each module as
       __define(name, factory) so tsc's CommonJS output gets its own scope. -->
  <script>
    var __modules = {};
    function __define(name, factory) {
      var module = { exports: {} };
      factory(require, module.exports, module);
      __modules[name] = module.exports;
    }
    function require(name) {
      var m = __modules[name.replace(/^.*\//, '')];
      if (!m) throw new Error('module not loaded: ' + name);
      return m;
    }
  </script>
  <script src="types.js"></script>
  <script src="layout.js"></script>
  <script src="footer.js"></script>
  <script src="card.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
